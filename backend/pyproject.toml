[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sops-editor"
version = "1.0.0"
description = "Web editor for SOPS-encrypted secrets"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "loguru==0.7.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
