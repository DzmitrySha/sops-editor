name: Feature request
description: Suggest an improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Alternatives you considered?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: |
        The tool is deliberately small: one container, no build step, plaintext
        never written to disk, SOPS policy never rewritten. Explain if the idea
        touches any of that.
