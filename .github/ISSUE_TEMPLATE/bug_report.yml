name: Bug report
description: Something does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste real secrets, private keys or
        plaintext values** — replace them with `REDACTED`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the "From computer" tab
        2. Choose secrets/app.enc.yaml
        3. ...
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run it
      options:
        - Docker Compose (Linux/macOS)
        - start-windows.cmd (Windows)
        - Behind Traefik / reverse proxy
        - Local dev server (uvicorn)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The `sops …` badge in the header, or the output of `sops --version` inside the container.
      placeholder: "sops 3.13.3"
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 141 / Edge 141 / Firefox 144"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        `docker compose logs --tail=100 ai-sops-editor`, browser console errors or
        screenshots. Remove secrets and paths you do not want to share.
      render: shell
