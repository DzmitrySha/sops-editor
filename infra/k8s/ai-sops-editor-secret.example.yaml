# Plaintext allowlist for ai-sops-editor-secret. Do not commit real values.
# Workflow:
#   cp ai-sops-editor-secret.example.yaml ai-sops-editor-secret.enc.yaml
#   fill CHANGE_ME values
#   sops -e -i infra/k8s/ai-sops-editor-secret.enc.yaml
#
# Only credentials belong here. Settings/FQDN/feature flags live in ai-sops-editor.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ai-sops-editor-secret
  namespace: ai-sops-editor
type: Opaque
stringData:
  # HTTP Basic auth password for the web UI.
  SOPS_EDITOR_AUTH_PASSWORD: "CHANGE_ME"

  # Fernet master key for /data/server-key/keyring.json.
  # Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  SOPS_EDITOR_KEYSTORE_KEY: "CHANGE_ME_FERNET_KEY"

  # Optional HTTPS git token (GitLab: oauth2, GitHub: x-access-token).
  SOPS_EDITOR_GIT_TOKEN: ""

  # Optional SSH deploy key. Mounted read-only as /ssh/id_ed25519.
  # The key needs write access to the GitLab project. Leave empty to use HTTPS token.
  id_ed25519: ""

  # Optional SSH known_hosts. Empty means TOFU + persistent /data/ssh/known_hosts.
  known_hosts: ""
