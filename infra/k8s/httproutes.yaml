# Prod FQDN: no -dev suffix (lab/work Compose uses ai-sops-editor-dev…).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-sops-editor-https
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - sops-editor.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ai-sops-editor
          port: 8080
